<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- Scanline overlay -->
    <pattern id="scanlines" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" y="0" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Scanlines -->
  <rect width="1200" height="630" fill="url(#scanlines)"/>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Accent line top -->
  <rect x="80" y="80" width="160" height="2" fill="url(#accent)"/>

  <!-- WAI wordmark -->
  <text
    x="80"
    y="310"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-size="160"
    font-weight="800"
    letter-spacing="-4"
    fill="#ffffff"
    fill-opacity="0.97"
  >WAI</text>

  <!-- Tagline -->
  <text
    x="82"
    y="370"
    font-family="'DM Mono', 'Courier New', monospace"
    font-size="22"
    font-weight="400"
    letter-spacing="2"
    fill="#a78bfa"
    fill-opacity="0.9"
  >Work runs autonomously.</text>

  <!-- Subtext -->
  <text
    x="82"
    y="415"
    font-family="'Manrope', 'Arial', sans-serif"
    font-size="18"
    font-weight="300"
    fill="#ffffff"
    fill-opacity="0.45"
  >AI-powered delivery · Software · Marketing · Consulting</text>

  <!-- Status pill -->
  <rect x="82" y="455" width="180" height="32" rx="4" fill="#1a1a2e" fill-opacity="0.9" stroke="#6c63ff" stroke-width="1" stroke-opacity="0.6"/>
  <circle cx="103" cy="471" r="5" fill="#22c55e"/>
  <text x="116" y="476" font-family="'DM Mono', monospace" font-size="12" fill="#a78bfa" letter-spacing="1">SYS:ONLINE</text>

  <!-- Domain -->
  <text
    x="1120"
    y="560"
    font-family="'DM Mono', monospace"
    font-size="16"
    fill="#ffffff"
    fill-opacity="0.3"
    text-anchor="end"
    letter-spacing="1"
  >wai.wawen.io</text>

  <!-- Accent line bottom right -->
  <rect x="960" y="548" width="160" height="1" fill="url(#accent)" fill-opacity="0.4"/>
</svg>
