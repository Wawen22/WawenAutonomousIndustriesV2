# WAI Nginx Configuration

# Dashboard
server {
    listen 80;
    server_name wai.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wai.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/wai.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wai.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Basic auth (optional - use Tailscale for better security)
    # auth_basic "WAI Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # Dashboard
    location / {
        proxy_pass http://wai-dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://wai-backend:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Security headers
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
}
